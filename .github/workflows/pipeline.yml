name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix['python-version'] }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'constraints-windows-py311.txt', 'constraints-windows-py313.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -U pip setuptools wheel
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ "${{ matrix.python-version }}" == "3.11" ]]; then
              python -m pip install -r requirements.txt -c constraints-windows-py311.txt --only-binary=:all: --prefer-binary
            else
              python -m pip install -r requirements.txt -c constraints-windows-py313.txt --only-binary=:all: --prefer-binary
            fi
          else
            python -m pip install -r requirements.txt --only-binary=:all: --prefer-binary
          fi
      - name: Run tests
        run: python tests/run_all.py
        env:
          NER_FORCE_PURE: ${{ runner.os == 'Windows' && '1' || '' }}
