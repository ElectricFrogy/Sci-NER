name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix['python-version'] }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --only-binary=:all: --prefer-binary -r requirements.txt -c constraints-windows-py311.txt || python -m pip install --only-binary=:all: --prefer-binary -r requirements.txt
      - name: Run tests
        run: python tests/run_all.py
        env:
          NER_FORCE_PURE: ${{ runner.os == 'Windows' && '1' || '' }}
